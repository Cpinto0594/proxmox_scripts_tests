# Tuned for the compose file's resource envelope:
#   container limit 4GB RAM / 2 vCPU, reservation 2GB / 1 vCPU
# Adjust shared_buffers / effective_cache_size / max_connections if you
# change the resource limits in docker-compose.yml — these numbers assume
# ~4GB total available to the container.

# Required: this custom config file replaces the auto-generated one inside
# PGDATA that the official image's entrypoint normally patches to '*' — 
# without this line Postgres falls back to its own default of 'localhost'
# and refuses every external connection despite the health check passing
# (pg_isready connects locally, so it never notices).
listen_addresses = '*'

# --- Connections ---
max_connections = 100
superuser_reserved_connections = 3

# --- Memory ---
shared_buffers = 1GB                  # ~25% of container memory
effective_cache_size = 3GB            # ~75% of container memory
maintenance_work_mem = 256MB
work_mem = 16MB                       # per sort/hash op; lower if max_connections is high

# --- Checkpointing / WAL ---
wal_level = replica
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# --- Storage (assumes local NVMe/SSD, not spinning disk or NFS) ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Parallelism (matches 2 vCPU limit) ---
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# --- Logging ---
log_min_duration_statement = 500      # log queries slower than 500ms
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# --- Autovacuum (don't let this drift on a prod box) ---
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
