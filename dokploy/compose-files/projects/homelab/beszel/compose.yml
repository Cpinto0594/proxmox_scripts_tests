services:
  beszel-hub:
    image: henrygd/beszel:0.19.0
    container_name: beszel-hub
    restart: unless-stopped
    environment:
      APP_URL: https://beszel.homelab.capilabs.dev   # used for notification links and agent config generation

    volumes:
      - beszel_hub_data:/beszel_data

    networks:
      - dokploy-network

    deploy:
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.hostname == docker-worker-1
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
      labels:
        - traefik.enable=true
        - traefik.http.routers.beszel-public.rule=Host(`${PUBLIC_DOMAIN}`)
        - traefik.http.routers.beszel-public.entrypoints=web
        - traefik.http.routers.beszel-public.service=beszel-hub
        
        - traefik.http.routers.beszel-local.rule=Host(`${LOCAL_DOMAIN}`)
        - traefik.http.routers.beszel-local.entrypoints=websecure
        - traefik.http.routers.beszel-local.tls.certresolver=cloudflare
        - traefik.http.routers.beszel-local.service=beszel-hub

        - traefik.http.services.beszel-hub.loadbalancer.server.port=8090
        - traefik.docker.network=dokploy-network

  beszel-agent:
    image: henrygd/beszel-agent:0.19.0
    container_name: beszel-agent
    restart: unless-stopped

    # Swarm doesn't support network_mode: host alongside deploy: (it gets silently
    # ignored by `docker stack deploy`), so this runs on the overlay network instead.
    # Trade-off: network-throughput stats reflect the container's own interface
    # rather than the physical NIC. CPU/memory/disk/Docker stats are unaffected.
    networks:
      - dokploy-network

    volumes:
      - beszel_agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro   # read-only: this is how it reads per-container stats

    environment:
      HUB_URL: http://beszel-hub:8090
      # Fill these in AFTER the hub is up: log into the hub, click "Add System",
      # and it generates a fresh KEY (SSH public key) + TOKEN pair for you to paste here.
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINcam8BsjksWvAYewez9Zg0crKo3GMeIo/pbxhKpFXgL"
      TOKEN: "5cc7-fe2f4005b4-292bd-cba05ade8"

    deploy:
      placement:
        constraints:
          - node.hostname == docker-worker-1
      resources:
        limits:
          memory: 64M
          cpus: "0.2"
        reservations:
          memory: 32M
          cpus: "0.05"

    depends_on:
      - beszel-hub

    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  beszel-agent-dev1:
    image: henrygd/beszel-agent:0.19.0
    container_name: beszel-agent-dev1
    restart: unless-stopped

    networks:
      - dokploy-network

    volumes:
      - beszel_agent_data_dev1:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro   # read-only: this is how it reads per-container stats

    environment:
      HUB_URL: http://beszel-hub:8090
      # Generate a SEPARATE KEY/TOKEN pair for this one via "Add System" in the hub —
      # name it something like "docker-dev-1" so it's distinguishable in the dashboard
      # from the worker-node agent. Each agent needs its own credentials.
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINcam8BsjksWvAYewez9Zg0crKo3GMeIo/pbxhKpFXgL"
      TOKEN: "25f4fda4-d62f-4d2f-b121-df7257920e4b"

    deploy:
      placement:
        constraints:
          - node.hostname == docker-dev-1
      resources:
        limits:
          memory: 64M
          cpus: "0.2"
        reservations:
          memory: 32M
          cpus: "0.05"

    depends_on:
      - beszel-hub

    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  dokploy-network:
    external: true

volumes:
  beszel_hub_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/docker-storage/beszel/hub_data
  beszel_agent_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/docker-storage/beszel/agent_data
  beszel_agent_data_dev1:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/docker-storage/beszel/agent_data