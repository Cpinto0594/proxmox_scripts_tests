[project]
site_name = "capilabs homelab"
site_description = "Proxmox, Kubernetes, Dokploy/Swarm, NAS and network documentation"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "README.md" },
  { "Inventory" = [
    { "Hardware" = "inventory/hardware.md" },
    { "IP plan" = "inventory/ip-plan.md" },
  ] },
  { "Network" = [
    "network/README.md",
    { "2.5G USB adapters" = "network/usb-2.5g-adapters.md" },
  ] },
  { "Platforms" = [
    { "Proxmox" = "platforms/proxmox.md" },
    { "Kubernetes" = "platforms/kubernetes.md" },
    { "Dokploy / Swarm" = "platforms/dokploy-swarm.md" },
    { "Database Clusters" = [
      {"PG Patroni Cluster" = "services/patroni-cluster-guide.md"}
      ] 
    },
  ] },
  { "Services" = "services/README.md" },
  { "Gotchas" = "gotchas.md" },
  { "Open items" = "open-items.md" },
  { "Issues" = [
    { "CPU Power Management" = "issues/proxmox/cpu-power-management.md" },
  ] },
]

[project.theme]
features = [
  "navigation.sections",
  "navigation.top",
  "search.highlight",
  "content.code.copy",
]

[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true

# Mermaid diagrams (topology in README, flowcharts in platforms/)
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
