http:
  middlewares:
    authentik:
      forwardAuth:
        address: http://homelab-authentik-nwlvpq_authentik-server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        maxResponseBodySize: 4194304
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
    # Public path: cloudflared hits the `web` entrypoint over plain HTTP. Without this,
    # the outpost builds http:// redirect URLs (same issue as authentik's own public router).
    forwarded-https:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https

  routers:
    default-router:
      rule: "Host(`dozzle.home.capilabs.dev`)"
      middlewares:
        - authentik
      priority: 10
      service: app
    default-router-auth:
      rule: "Host(`dozzle.home.capilabs.dev`) && PathPrefix(`/outpost.goauthentik.io/`)"
      priority: 15
      service: authentik
  services:
    app:
      loadBalancer:
        servers:
          - url: http://ip.internal
    authentik:
      loadBalancer:
        servers:
          - url: http://homelab-authentik-nwlvpq_authentik-server:9000/outpost.goauthentik.io
