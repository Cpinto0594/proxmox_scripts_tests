version: "3.8"

# ------------------------------------------------------------------
# Forgejo — production stack for Docker Swarm (Dokploy)
# ------------------------------------------------------------------

services:
  forgejo-db:
    image: postgres:16-alpine
    #dns_search: []   # prevent Tailscale's host search domain from polluting internal DNS lookups
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgejo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-forgejo}
    volumes:
      - forgejo-db-data:/var/lib/postgresql/data
    networks:
      - forgejo-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgejo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == docker-worker-1   # <-- adjust to your target node
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 30s
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  forgejo-redis:
    image: redis:7-alpine
    #dns_search: []   # same fix — avoid Tailscale search-domain suffix on lookups
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "60", "1"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}   # needed so the healthcheck below can see it at runtime
    volumes:
      - forgejo-redis-data:/data
    networks:
      - forgejo-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == docker-worker-1   # <-- keep on same node as forgejo-db
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M

  forgejo:
    image: codeberg.org/forgejo/forgejo:10   # pin to a specific stable tag; check codeberg.org/forgejo/forgejo/releases
    #dns_search: []   # this is the fix for the forgejo-redis lookup failure — see README
    entrypoint: ["/bin/sh", "-c", "sleep 20 && exec /usr/bin/entrypoint \"$$@\"", "--"]
    environment:
      USER_UID: 1000
      USER_GID: 1000

      # --- Database ---
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-db:5432
      FORGEJO__database__NAME: ${POSTGRES_DB:-forgejo}
      FORGEJO__database__USER: ${POSTGRES_USER:-forgejo}
      FORGEJO__database__PASSWD: ${POSTGRES_PASSWORD}

      # --- Server / routing ---
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO__server__ROOT_URL: https://${FORGEJO_DOMAIN}/
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__PROTOCOL: http          # Traefik/Cloudflare terminate TLS in front
      FORGEJO__server__SSH_DOMAIN: ${FORGEJO_DOMAIN}
      FORGEJO__server__SSH_PORT: 2222
      FORGEJO__server__SSH_LISTEN_PORT: 2222   # must match the port actually mapped below
      # NOTE: no START_SSH_SERVER here — this image variant ships its own OpenSSH
      # server already wired to SSH_LISTEN_PORT; enabling the built-in one too
      # causes both to fight over the same port ("address already in use").
      FORGEJO__server__LFS_START_SERVER: "true"

      # --- Cache / session / queue on Redis (needed for HA + Actions load) ---
      FORGEJO__cache__ENABLED: "true"
      FORGEJO__cache__ADAPTER: redis
      FORGEJO__cache__HOST: redis://:${REDIS_PASSWORD}@forgejo-redis:6379/0
      FORGEJO__session__PROVIDER: redis
      FORGEJO__session__PROVIDER_CONFIG: redis://:${REDIS_PASSWORD}@forgejo-redis:6379/1
      FORGEJO__queue__TYPE: redis
      FORGEJO__queue__CONN_STR: redis://:${REDIS_PASSWORD}@forgejo-redis:6379/2

      # --- Mailer (optional but recommended for prod: password resets, notifications) ---
      FORGEJO__mailer__ENABLED: ${MAILER_ENABLED:-false}
      FORGEJO__mailer__SMTP_ADDR: ${SMTP_ADDR:-}
      FORGEJO__mailer__SMTP_PORT: ${SMTP_PORT:-587}
      FORGEJO__mailer__FROM: ${SMTP_FROM:-}
      FORGEJO__mailer__USER: ${SMTP_USER:-}
      FORGEJO__mailer__PASSWD: ${SMTP_PASSWORD:-}

      # --- Features ---
      FORGEJO__packages__ENABLED: "true"       # multi-format package registry
      FORGEJO__actions__ENABLED: "true"        # CI/CD (needs forgejo-runner, see README)
      FORGEJO__repository__ENABLE_PUSH_CREATE_USER: "true"
      FORGEJO__repository__ENABLE_PUSH_CREATE_ORG: "true"

      # --- Security / lockdown for prod ---
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"   # flip to false if you want public signup
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"

    volumes:
      - forgejo-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - forgejo-internal
      - dokploy-network
    ports:
      - target: 2222
        published: 2222
        protocol: tcp
        mode: host      # host-mode: git-over-SSH bypasses Cloudflare Tunnel, hits this node directly
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == docker-worker-1   # <-- must match forgejo-db/forgejo-redis node
      update_config:
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: on-failure
        delay: 10s          # a bit more breathing room for Redis/Postgres to be ready
        window: 60s
        # no max_attempts: Swarm doesn't respect depends_on, so this may need
        # a few tries after a cold start (e.g. node reboot) — keep retrying
        # rather than giving up and sitting in Shutdown state
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M
      labels:
        - traefik.enable=true

        # Public — reached via Cloudflare Tunnel, which already terminates TLS at the edge
        - traefik.http.routers.forgejo-public.rule=Host(`${FORGEJO_PUBLIC_DOMAIN}`)
        - traefik.http.routers.forgejo-public.entrypoints=web
        - traefik.http.routers.forgejo-public.service=forgejo

        # Local — reached directly via Technitium, terminates TLS itself using the new Cloudflare resolver
        - traefik.http.routers.forgejo-local.rule=Host(`forgejo.home.capilabs.dev`)
        - traefik.http.routers.forgejo-local.entrypoints=websecure
        - traefik.http.routers.forgejo-local.tls.certresolver=cloudflare
        - traefik.http.routers.forgejo-local.service=forgejo

        - traefik.http.services.forgejo.loadbalancer.server.port=3000
        - traefik.docker.network=dokploy-network

volumes:
  forgejo-db-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/docker-storage/forgejo/db
  forgejo-redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/docker-storage/forgejo/redis
  forgejo-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/docker-storage/forgejo/data

networks:
  forgejo-internal:
    driver: overlay
    internal: true        # DB/Redis never need to leave this stack
  dokploy-network:
    external: true         # rename to your actual Dokploy/Traefik network


