version: "3.8"

# ------------------------------------------------------------------
# Forgejo — production stack for Docker Swarm (Dokploy)
# ------------------------------------------------------------------

services:
  forgejo-runner:
    user: "0:0" 
    image: code.forgejo.org/forgejo/runner:12.9.0   # check code.forgejo.org/forgejo/runner/releases for newer tags
    container_name: forgejo-runner
    command: ["forgejo-runner", "daemon"]
    restart: unless-stopped
    volumes:
      - forgejo-runner1:/data
      - /var/run/docker.sock:/var/run/docker.sock   # lets job containers run as siblings on the host's Docker
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == docker-worker-1  
    networks:
      - forgejo-internal
      - dokploy-network

volumes:
  forgejo-runner1:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/docker-storage/forgejo-runner1/data

networks:
  forgejo-internal:
    driver: overlay
    external: true       
  dokploy-network:
    external: true       