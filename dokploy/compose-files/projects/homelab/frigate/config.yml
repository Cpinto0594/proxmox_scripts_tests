mqtt:
  enabled: false # enable + point at your broker if you want HA integration later

# go2rtc handles the RTSP connection once, and Frigate + any other client
# (VLC, Home Assistant, etc.) can restream from it — avoids overloading the camera.
go2rtc:
  streams:
    cam1:
      - rtsp://cpinto:P@ssw0rds@192.168.1.50:554/stream1
    cam2:
      - rtsp://cpinto:P@ssw0rds@192.168.1.51:554/stream1
    cam3:
      - rtsp://cpinto:P@ssw0rds@192.168.1.52:554/stream1
    cam4:
      - rtsp://cpinto:P@ssw0rds@192.168.1.54:554/stream1
    cam5:
      - rtsp://cpinto:P@ssw0rds@192.168.1.55:554/stream1

cameras:
  cam1:
    friendly_name: "2DO"  
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/cam1
          input_args: preset-rtsp-restream
          roles:
            - detect
            - record
    detect:
      width: 1280
      height: 720
      fps: 5
    record:
      enabled: false
      motion:
        days: 7
      alerts:
        retain:
          days: 14
          mode: motion
      detections:
        retain:
          days: 14
          mode: motion

