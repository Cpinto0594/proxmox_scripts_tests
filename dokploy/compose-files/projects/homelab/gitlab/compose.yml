services:
  gitlab:
    image: gitlab/gitlab-ce:19.3.2-ce.0   # pin explicitly; check hub.docker.com/r/gitlab/gitlab-ce/tags for newer patch releases before deploying
    container_name: gitlab
    hostname: gitlab.homelab.capilabs.dev
    restart: unless-stopped
    shm_size: "256m"

    # --- Omnibus configuration ---
    # Everything GitLab needs (nginx, unicorn/puma, sidekiq, postgres, redis, registry)
    # is baked into this one image and configured through this single block.

    ports:
      - "2222:22"   # git-over-ssh; change the host side if 2222 is already taken on docker-dev-1

    volumes:
      - gitlab-config:/etc/gitlab
      - ../files/gitlab.rb:/etc/gitlab/gitlab.rb:ro
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab

    networks:
      - dokploy-network

    labels:
      - traefik.enable=true
      # Web UI
      - traefik.http.routers.gitlab-web.rule=Host(`gitlab.homelab.capilabs.dev`)
      - traefik.http.routers.gitlab-web.entrypoints=web
      - traefik.http.routers.gitlab-web.service=gitlab-web
      - traefik.http.services.gitlab-web.loadbalancer.server.port=80
      # Container Registry
      - traefik.http.routers.gitlab-registry.rule=Host(`registry.homelab.capilabs.dev`)
      - traefik.http.routers.gitlab-registry.entrypoints=web
      - traefik.http.routers.gitlab-registry.service=gitlab-registry
      - traefik.http.services.gitlab-registry.loadbalancer.server.port=5050

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/-/readiness?all=1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s   # first boot can genuinely take 3-5 minutes

    deploy:
      resources:
        limits:
          memory: 6g
        reservations:
          memory: 4g

networks:
  dokploy-network:
    external: true

volumes:
  gitlab-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/docker-storage/gitlab/logs
  gitlab-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/docker-storage/gitlab/data
  gitlab-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/docker-storage/gitlab/config