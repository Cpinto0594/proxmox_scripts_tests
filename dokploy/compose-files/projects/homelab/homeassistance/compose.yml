services:
  homeassistant:
    image: homeassistant/home-assistant:2026.9.0
    container_name: homeassistant
    restart: unless-stopped
    environment:
      - TZ=America/Bogota
    volumes:
      - homeassistant-config:/config
    ports:
      - target: 8123
        published: 9004
        protocol: tcp
        mode: host
    deploy:
      placement:
        constraints:
          - node.hostname == docker-worker-1
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
      restart_policy:
        condition: on-failure
    networks: 
      - dokploy-network


networks:
  dokploy-network:
    external: true
    
volumes:
  homeassistant-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/docker-storage/homeassistant