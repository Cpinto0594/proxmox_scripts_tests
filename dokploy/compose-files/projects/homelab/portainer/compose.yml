services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - target: 9443
        published: 9001
        protocol: tcp
        mode: host
        host_ip: "${TAILSCALE_IP}"   # dashboard reachable only over your tailnet
      - target: 9443
        published: 9001
        protocol: tcp
        mode: host
        host_ip: "${DOCKER_NODE_IP}"        # enable node ip .40/24
      - target: 8000
        published: 8000
        protocol: tcp
        mode: host
        host_ip: "${TAILSCALE_IP}"   # dashboard reachable only over your tailnet
      - target: 8000
        published: 8000
        protocol: tcp
        mode: host
        host_ip: "${DOCKER_NODE_IP}"        # enable node ip .40/24
    
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer-public.rule=Host(`${PUBLIC_DOMAIN}`)
      - traefik.http.routers.portainer-public.entrypoints=web
      - traefik.http.routers.portainer-public.service=portainer

      - traefik.http.routers.portainer-local.rule=Host(`${LOCAL_DOMAIN}`)
      - traefik.http.routers.portainer-local.entrypoints=websecure
      - traefik.http.routers.portainer-local.tls.certresolver=cloudflare
      - traefik.http.routers.portainer-local.service=portainer
      - traefik.http.routers.portainer-local.tls=true

      - traefik.http.services.portainer.loadbalancer.server.port=9000
      - traefik.docker.network=dokploy-network

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - dokploy-network
networks:
  dokploy-network:
    external: true
volumes:
  portainer_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/docker-storage/portainer
