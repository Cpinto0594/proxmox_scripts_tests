# Tuned for the lightweight instance's resource envelope:
#   container limit 2GB RAM / 1 vCPU, reservation 1GB / 0.5 vCPU
# Half the footprint of the main prod instance's postgresql.conf — adjust
# these if you change deploy.resources.limits in the compose file.

# Required from day one this time — this is exactly the line that was
# missing from the main instance's config and caused it to silently refuse
# every external connection despite passing its health check. This custom
# config file replaces the one the entrypoint normally patches to '*'.
listen_addresses = '*'

# --- Connections ---
max_connections = 50
superuser_reserved_connections = 3

# --- Memory ---
shared_buffers = 512MB                # ~25% of container memory
effective_cache_size = 1536MB         # ~75% of container memory
maintenance_work_mem = 128MB
work_mem = 8MB                        # per sort/hash op; lower if max_connections is high

# --- Checkpointing / WAL ---
wal_level = replica
wal_buffers = 8MB
min_wal_size = 512MB
max_wal_size = 2GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# --- Storage (assumes local NVMe/SSD) ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Parallelism (matches 1 vCPU limit) ---
max_worker_processes = 2
max_parallel_workers_per_gather = 1
max_parallel_workers = 2
max_parallel_maintenance_workers = 1

# --- Logging ---
log_min_duration_statement = 500
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# --- Autovacuum ---
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s