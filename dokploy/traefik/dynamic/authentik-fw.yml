# Traefik dynamic config: authentik forward auth (embedded outpost) for apps without SSO.
# Lives in Dokploy's Traefik dynamic dir on docker-dev-1: /etc/dokploy/traefik/dynamic/authentik-fw.yml
# Shared parts only. Routers are labels on each app:
#   <app>-public / <app>-local     middlewares=[forwarded-https@file,]authentik@file
#   <app>-outpost-public / -local  Host(app) && PathPrefix(/outpost.goauthentik.io/) -> authentik-outpost@file
# The address uses the authentik Swarm service name (<stack>_authentik-server); update it if the stack is recreated.
# Docs: docs-zensical/docs/services/authentik-forward-auth.md
http:
  middlewares:
    authentik:
      forwardAuth:
        address: http://homelab-authentik-nwlvpq_authentik-server:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        maxResponseBodySize: 4194304
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version

    # Public path: cloudflared hits the `web` entrypoint over plain HTTP. Without this,
    # the outpost builds http:// redirect URLs (same issue as authentik's own public router).
    forwarded-https:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https

  services:
    # Used by the per-app `<app>-outpost-*` routers (Dozzle labels: service=authentik-outpost@file).
    # No path here: the request already carries /outpost.goauthentik.io/...
    authentik-outpost:
      loadBalancer:
        servers:
          - url: http://homelab-authentik-nwlvpq_authentik-server:9000
