# Traefik dynamic config for the Technitium DNS web consoles (LXC, native install).
# Lives in Dokploy's Traefik dynamic config dir on docker-dev-1 (Dokploy UI ->
# Traefik -> File System / dynamic, usually /etc/dokploy/traefik/dynamic/).
# TODO: confirm the exact path/file name on docker-dev-1.
#
#   dns.home.capilabs.dev   -> both servers, load-balanced (sticky + health check)
#   dns1.home.capilabs.dev  -> 192.168.10.2 only (LXC 108, production)
#   dns2.home.capilabs.dev  -> second server only
#
# Sticky cookie: Technitium login sessions are per server, so a browser must keep
# hitting the same one. Health check: if that server dies, Traefik moves you to the
# other (you log in again there).
# Docs: docs-zensical/docs/services/technitium-dns-lxc.md#web-console-through-traefik
http:
  routers:
    technitium-lxc-local:
      rule: "Host(`dns.home.capilabs.dev`)"
      entrypoints: [websecure]
      tls:
        certResolver: cloudflare
      service: technitium-lxc

    technitium-lxc-1-local:
      rule: "Host(`dns1.home.capilabs.dev`)"
      entrypoints: [websecure]
      tls:
        certResolver: cloudflare
      service: technitium-lxc-1

    technitium-lxc-2-local:
      rule: "Host(`dns2.home.capilabs.dev`)"
      entrypoints: [websecure]
      tls:
        certResolver: cloudflare
      service: technitium-lxc-2

  services:
    # Shared name: both servers
    technitium-lxc:
      loadBalancer:
        sticky:
          cookie:
            name: technitium_node
            secure: true
            httpOnly: true
            sameSite: lax
        healthCheck:
          path: /
          interval: 10s
          timeout: 3s
        servers:
          - url: "http://192.168.10.2:5380"
          - url: "http://192.168.10.3:5380"   # TODO: set to the second server's real IP

    # Direct names: one server each
    technitium-lxc-1:
      loadBalancer:
        servers:
          - url: "http://192.168.10.2:5380"

    technitium-lxc-2:
      loadBalancer:
        servers:
          - url: "http://192.168.10.3:5380"   # TODO: set to the second server's real IP
